<!doctype html>
<!--
  Open Graph image source (1200x630).
  Regenerate with: chrome --headless --screenshot=public/og-image.png --window-size=1200,630 og-source.html
  Replace "DeTechGuy" with your real name before shipping.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #ffffff;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #0b0b14;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      .orb-1 { width: 560px; height: 560px; background: #4f46e5; opacity: 0.22; top: -180px; right: -120px; }
      .orb-2 { width: 420px; height: 420px; background: #06b6d4; opacity: 0.2; bottom: -160px; left: -100px; }
      .orb-3 { width: 300px; height: 300px; background: #f472b6; opacity: 0.2; top: 40%; left: 42%; }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(#e8e9f0 1px, transparent 1px),
          linear-gradient(90deg, #e8e9f0 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 72%);
        mask-image: radial-gradient(ellipse at center, #000 20%, transparent 72%);
        opacity: 0.6;
      }
      .content {
        position: relative;
        height: 100%;
        padding: 84px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
      }
      .pill {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 20px;
        border: 1px solid #e8e9f0;
        border-radius: 999px;
        background: #fff;
        font-size: 17px;
        font-weight: 700;
        color: #5b6075;
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #22c55e;
      }
      h1 {
        font-size: 76px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.02;
      }
      h1 span {
        background: linear-gradient(120deg, #4f46e5, #7c3aed 55%, #db2777);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .role {
        font-size: 26px;
        font-weight: 500;
        color: #5b6075;
        letter-spacing: -0.01em;
      }
      .chips { display: flex; gap: 16px; margin-top: 8px; }
      .chip {
        padding: 14px 26px;
        background: #fff;
        border: 1px solid #e8e9f0;
        border-radius: 16px;
        font-size: 21px;
        font-weight: 700;
        color: #0b0b14;
        box-shadow: 0 18px 40px -22px rgba(11, 11, 20, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid"></div>
    <div class="content">
      <div class="pill"><span class="dot"></span> Available for freelance &amp; full-time</div>
      <h1>DeTechGuy<span>.</span><br />Full-Stack Developer</h1>
      <p class="role">Web apps · APIs · Automations — built end to end.</p>
      <div class="chips">
        <span class="chip">⚛ React</span>
        <span class="chip"> Node.js</span>
        <span class="chip">PostgreSQL</span>
      </div>
    </div>
  </body>
</html>
